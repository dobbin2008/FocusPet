<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login - Study Buddy</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/1style.css">
  </head>
  <body>
    <header class="site-header">
      <nav class="site-nav" aria-label="Navegação principal">
        <div class="site-brand-container">
          <a class="site-brand" href="/" aria-label="Study Buddy - início">
            <span class="site-brand-mark" aria-hidden="true">S</span>
            <span>Study Buddy</span>
          </a>
          <span class="site-version">Versão 1.1.2</span>
        </div>
        <div class="site-links">
          <a href="/">Início</a>
          <a href="/agenda">Agenda</a>
          <a href="/resumo">Resumo semanal</a>
        </div>
        <div class="site-actions">
          <a id="loginBtn" class="account-link" href="/login" aria-label="Entrar">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M20 21a8 8 0 0 0-16 0M12 13a5 5 0 1 0 0-10 5 5 0 0 0 0 10Z"/>
            </svg>
            <span>Entrar</span>
          </a>
          <button id="temaBtn" class="theme-button" type="button" aria-label="Alternar tema">☀️</button>
        </div>
      </nav>
    </header>
    <main class="auth-page">
      <div class="auth-layout">
        <aside class="auth-art">
          <div class="auth-art-brand">
            <span class="auth-art-mark" aria-hidden="true">S</span>
            <span>STUDY BUDDY</span>
          </div>
          <div class="auth-art-pet">
            <img src="/static/img/weedle%20base%20grup0.png" alt="Weedle, mascote do Study Buddy">
          </div>
          <div class="auth-art-copy">
            <span class="auth-eyebrow">SEU ESPAÇO DE FOCO</span>
            <h2>Volte para o que importa.</h2>
            <p>Seu próximo passo começa aqui.</p>
          </div>
        </aside>

        <section class="auth-card" aria-labelledby="loginTitulo">
          <div class="auth-card-heading">
            <span class="auth-eyebrow">BEM-VINDO DE VOLTA</span>
            <h1 id="loginTitulo">Entrar</h1>
            <p>Acesse sua conta Study Buddy.</p>
          </div>
          <form id="loginForm" class="auth-form">
            <div class="auth-field">
              <label for="loginEmail">Email</label>
              <input id="loginEmail" type="email" name="email" autocomplete="email" placeholder="voce@exemplo.com" required>
            </div>
            <div class="auth-field">
              <label for="loginSenha">Senha</label>
              <div class="password-input-wrap">
                <input id="loginSenha" type="password" name="senha" autocomplete="current-password" placeholder="Sua senha" required>
                <button class="password-toggle" type="button" aria-label="Mostrar senha" aria-pressed="false" data-password-toggle="loginSenha">
                  <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                    <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/>
                    <circle cx="12" cy="12" r="3"/>
                  </svg>
                </button>
              </div>
            </div>
            <div class="auth-actions">
              <button type="submit" class="auth-submit">Entrar no Study Buddy</button>
            </div>
          </form>
          <p id="authMensagem" class="auth-message" role="status" aria-live="polite"></p>
          <div class="auth-links">
            <span>Não tem uma conta?</span>
            <a href="/cadastro">Criar conta</a>
          </div>
        </section>
      </div>
    </main>
    <script src="/static/js/script.js"></script>
    <script src="/static/js/auth.js"></script>
  </body>
</html>
