<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FocusPet Blocker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            width: 350px;
            font-family: 'Montserrat', sans-serif;
            background: #000814;
            color: #fff;
            padding: 0;
        }
        
        .container {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        h1 {
            font-size: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
        }
        
        .status {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            border: 2px solid transparent;
            transition: 0.3s;
        }
        
        .status.ativo {
            background: rgba(244, 67, 54, 0.2);
            border-color: #f44336;
        }
        
        .status.inativo {
            background: rgba(76, 175, 80, 0.2);
            border-color: #4caf50;
        }
        
        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            animation: pulse 1s infinite;
        }
        
        .status-dot.ativo {
            background: #f44336;
        }
        
        .status-dot.inativo {
            background: #4caf50;
        }
        
        .status-text {
            flex: 1;
            font-weight: 600;
            font-size: 14px;
        }
        
        .bloqueio-info {
            background: rgba(21, 101, 255, 0.1);
            border: 1px solid #1565ff;
            border-radius: 8px;
            padding: 12px;
            display: none;
        }
        
        .bloqueio-info h3 {
            font-size: 13px;
            margin-bottom: 8px;
            color: #64b5f6;
        }
        
        #urlasBloqueadasList {
            list-style: none;
            font-size: 12px;
            max-height: 150px;
            overflow-y: auto;
            padding-right: 6px;
        }
        
        #urlasBloqueadasList li {
            padding: 6px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 4px;
            margin-bottom: 4px;
            word-break: break-all;
            border-left: 2px solid #1565ff;
            padding-left: 8px;
        }
        
        #urlasBloqueadasList::-webkit-scrollbar {
            width: 5px;
        }
        
        #urlasBloqueadasList::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
        }
        
        #urlasBloqueadasList::-webkit-scrollbar-thumb {
            background: #1565ff;
            border-radius: 10px;
        }
        
        .cronometro-info {
            background: rgba(21, 101, 255, 0.1);
            border: 1px solid #1565ff;
            border-radius: 8px;
            padding: 12px;
            text-align: center;
            display: none;
        }
        
        .cronometro-info strong {
            display: block;
            font-size: 24px;
            font-family: 'Courier New', monospace;
            color: #1565ff;
            margin-bottom: 8px;
        }
        
        .buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        button {
            flex: 1;
            min-width: 100px;
            padding: 10px 12px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: 0.3s;
        }
        
        .btn-desativar {
            background: #f44336;
            color: white;
        }
        
        .btn-desativar:hover {
            background: #ef233c;
            transform: translateY(-1px);
        }
        
        .btn-abrir {
            background: #1565ff;
            color: white;
        }
        
        .btn-abrir:hover {
            background: #2d76ff;
            transform: translateY(-1px);
        }
        
        .info {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.6);
            text-align: center;
            margin-top: 10px;
            padding: 8px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 6px;
        }
        
        .sessao-id {
            font-family: 'Courier New', monospace;
            font-size: 11px;
            color: #64b5f6;
        }
        
        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.5;
            }
        }
        
        .divider {
            height: 1px;
            background: rgba(255, 255, 255, 0.2);
            margin: 5px 0;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🚫 FocusPet Blocker</h1>
    
    <div id="status" class="status inativo">
        <div id="statusDot" class="status-dot inativo"></div>
        <div id="statusText" class="status-text">Status: Inativo</div>
    </div>
    
    <div id="bloqueioInfo" class="bloqueio-info">
        <h3>📍 Sites Bloqueados:</h3>
        <ul id="urlasBloqueadasList"></ul>
        
        <div class="divider"></div>
        
        <div id="cronometroInfo" class="cronometro-info">
            <strong id="cronometro">00:00:00</strong>
            <span id="sessaoInfo"></span>
        </div>
    </div>
    
    <div class="buttons">
        <button id="desativarBtn" class="btn-desativar" style="display: none;">
            🛑 Desativar
        </button>
        <button id="abrirBtn" class="btn-abrir">
            🔗 Abrir FocusPet
        </button>
    </div>
    
    <div class="info">
        <p>Extensão de bloqueio para FocusPet</p>
        <p>v1.0.0</p>
    </div>
</div>

<script src="popup.js"></script>

</body>
</html>
