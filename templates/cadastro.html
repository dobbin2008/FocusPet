<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cadastro - FocusPet</title>
    <link rel="stylesheet" href="/static/css/1style.css">
  </head>
  <body>
    <header>
      <nav>
        <a href="/">PET</a>
        <a href="/agenda">AGENDA</a>
        <div class="menuDir">
          <a id="loginBtn" class="conta" href="/login" aria-label="Entrar"><span class="material-symbols-outlined">account_circle</span></a>
          <div class="logo">FOCUSPET</div>
          <button id="temaBtn" type="button" aria-label="Alternar tema">☀️</button>
        </div>
      </nav>
    </header>
    <main class="page-content">
      <section class="card">
        <h1>Cadastro</h1>
        <form method="post">
          <label>Email</label>
          <input type="email" name="email" required>
          <label>Senha</label>
          <input type="password" name="senha" required>
          <button type="submit">Criar conta</button>
        </form>
        <p><a href="/login">Já tenho conta</a></p>
      </section>
    </main>
    <script src="/static/js/script.js"></script>
  </body>
</html>
