{% extends 'base.html' %}

{% block title %}Admin - Pets{% endblock %}

{% block content %}
  <section class="card">
    <h1>Pets</h1>
    <form method="post">
      <label>Nome</label>
      <input type="text" name="nome" required>
      <button type="submit">Criar pet</button>
    </form>

    <ul>
      {% for pet in pets %}
        <li>
          {{ pet.nome }} — nível {{ pet.nivel }}
          <form method="post" action="{{ url_for('admin.deletar_pet_admin', pet_id=pet.id) }}" style="display:inline;">
            <button type="submit">Excluir</button>
          </form>
        </li>
      {% else %}
        <li>Nenhum pet cadastrado.</li>
      {% endfor %}
    </ul>

    <p><a href="{{ url_for('admin.painel_admin') }}">Voltar</a></p>
  </section>
{% endblock %}
