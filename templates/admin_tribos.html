{% extends 'base.html' %}

{% block title %}Admin - Tribos{% endblock %}

{% block content %}
  <section class="card">
    <h1>Tribos</h1>
    <form method="post">
      <label>Matéria</label>
      <input type="text" name="materia" required>
      <button type="submit">Criar tribo</button>
    </form>

    <ul>
      {% for tribo in tribos %}
        <li>
          {{ tribo.materia }}
          <form method="post" action="{{ url_for('admin.deletar_tribo_admin', tribo_id=tribo.id) }}" style="display:inline;">
            <button type="submit">Excluir</button>
          </form>
        </li>
      {% else %}
        <li>Nenhuma tribo cadastrada.</li>
      {% endfor %}
    </ul>

    <p><a href="{{ url_for('admin.painel_admin') }}">Voltar</a></p>
  </section>
{% endblock %}
