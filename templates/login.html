{% extends 'base.html' %}

{% block title %}Login - FocusPet{% endblock %}

{% block content %}
  <section class="card">
    <h1>Login</h1>
    <form method="post">
      <label>Email</label>
      <input type="email" name="email" required>

      <label>Senha</label>
      <input type="password" name="senha" required>

      <button type="submit">Entrar</button>
    </form>
    <p><a href="{{ url_for('auth.cadastro') }}">Criar conta</a></p>
  </section>
{% endblock %}
