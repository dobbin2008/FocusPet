<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login - FocusPet</title>
    <link rel="stylesheet" href="/static/css/1style.css">
  </head>
  <body>
    <header>
      <nav>
        <a href="/">PET</a>
        <a href="/agenda">AGENDA</a>
        <div class="menuDir">
          <a id="loginBtn" class="conta" href="/login" aria-label="Entrar"><span class="material-symbols-outlined">account_circle</span></a>
          <div class="logo">FOCUSPET</div>
          <button id="temaBtn" type="button" aria-label="Alternar tema">☀️</button>
        </div>
      </nav>
    </header>
    <main class="page-content">
      <section class="auth-shell">
        <div class="modal active">
          <div class="modal2">
            <h1>FocusPet</h1>
            <p class="auth-subtitle">Acesse o painel de administração ou continue no site.</p>
            <form method="post">
              <input type="email" name="email" placeholder="Digite seu e-mail" required>
              <input type="password" name="senha" maxlength="8" placeholder="Digite sua senha" required>
              <div class="auth-actions">
                <button type="submit" class="loginBtn2" name="next" value="site">Entrar no site</button>
                <button type="submit" class="loginBtn2 secondary" name="next" value="admin">Entrar no admin</button>
              </div>
            </form>
            <div class="auth-links">
              <a href="/cadastro">Criar conta</a>
              <a href="/">Voltar ao site</a>
            </div>
          </div>
        </div>
      </section>
    </main>
    <script src="/static/js/script.js"></script>
  </body>
</html>
