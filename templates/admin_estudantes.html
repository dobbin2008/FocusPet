{% extends 'base.html' %}

{% block title %}Admin - Estudantes{% endblock %}

{% block content %}
  <section class="card">
    <h1>Estudantes</h1>
    <form method="post">
      <label>Email</label>
      <input type="email" name="email" required>
      <label>Senha</label>
      <input type="password" name="senha" required>
      <button type="submit">Criar estudante</button>
    </form>
    <p><a href="{{ url_for('admin.painel_admin') }}">Voltar</a></p>
  </section>
{% endblock %}
